name: NHMA V2 Quality Gate

on:
  push:
    branches:
      - 'research/**'
  pull_request:
    paths:
      - 'index.html'
      - 'skills/**'
      - 'evals/**'
      - 'scripts/**'
      - 'docs/**'

permissions:
  contents: read

jobs:
  static-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v2 UI and regression suite
        run: node scripts/validate-v2.mjs
      - name: Render branch UI with headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nhma-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,1200 --screenshot=visual-artifacts/home-desktop.png http://127.0.0.1:4173/index.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=390,844 --screenshot=visual-artifacts/home-mobile.png http://127.0.0.1:4173/index.html
          test -s visual-artifacts/home-desktop.png
          test -s visual-artifacts/home-mobile.png
      - name: Install browser smoke dependency
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Run live search, compare and chat browser smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          export CHROME_PATH="$CHROME"
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nhma-smoke-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node scripts/browser-smoke.mjs
      - name: Upload visual snapshots and smoke result
        uses: actions/upload-artifact@v4
        with:
          name: nhma-v2-visual-snapshots
          path: |
            visual-artifacts/*.png
            visual-artifacts/smoke-result.json
          if-no-files-found: error
          retention-days: 7
