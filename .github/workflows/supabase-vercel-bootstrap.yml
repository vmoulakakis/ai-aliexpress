name: Bootstrap Vercel via Supabase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-vercel-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask Supabase to create/link/deploy EU Scout
        shell: bash
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl --silent --show-error --max-time 20 \
            -o /tmp/vercel-bootstrap.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{}' \
            'https://prrehmcvpyhupvlhtbzg.supabase.co/functions/v1/nhma-vercel-bootstrap')
          cat /tmp/vercel-bootstrap.json
          echo
          echo "HTTP status: $HTTP_STATUS"
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/vercel-bootstrap.json','utf8'));if(!d.ok){console.error('Bootstrap failed:',d);process.exit(2)};console.log('Project:',d.projectState,d.projectId||'');console.log('Deployment:',d.deploymentId||'');console.log('URL:',d.deploymentUrl||'');console.log('State:',d.readyState||'')"
