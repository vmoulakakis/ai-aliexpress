name: Bootstrap EU Scout on Vercel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vercel-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eu-scout-vercel-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: vassilis-projects-3bf8541b
      VERCEL_PROJECT: eu-scout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN secret is not configured in this repository.'
            exit 2
          fi

      - name: Install application
        run: npm install --no-audit --no-fund

      - name: Ensure persistent Vercel project exists
        shell: bash
        run: |
          if npx --yes vercel@latest project inspect "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/tmp/vercel-project.txt 2>&1; then
            cat /tmp/vercel-project.txt
          else
            cat /tmp/vercel-project.txt
            npx --yes vercel@latest project add "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi

      - name: Link checkout to EU Scout project
        run: npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Production deployment
        shell: bash
        run: |
          URL=$(npx --yes vercel@latest deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "Production URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
